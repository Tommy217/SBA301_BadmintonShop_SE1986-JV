spring.application.name=badmintonshop
server.port=8080
shop.frontend-url=${SHOP_FRONTEND_URL:http://localhost:5173}
fastship.api-url=${FASTSHIP_API_URL:http://localhost:8081}

# =====================================================================
# Database Configuration (SQL Server)
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=badminton_shop;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sa}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# =====================================================================
# payOS Payment Gateway & Webhook Configuration
# =====================================================================
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
